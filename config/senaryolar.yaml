# ------------------------------------------------------------------------------
# Senaryo 1: isyeri_gunduz
# Kurumsal ofis/kamp├╝s g├╝nd├╝z ┼şarj─▒. ACN-Data ampirik verisi ile kalibre edilmi┼ştir.
# ------------------------------------------------------------------------------
isyeri_gunduz:
  aciklama: "T├╝rkiye ─░┼ş Yeri / Ofis Kamp├╝s├╝ G├╝nd├╝z ┼Şarj─▒ (ACN Kalibrasyonlu)"
  site_id: "TR_ISYERI"
  kalibrasyon_tipi: "ACN_AMPIRIK"              # ACN JPL/Caltech ampirik verisinden ortak ├Ârnekleme
  soket_sayisi: 30                             # VARSAYIM [min: 10, tipik: 30, max: 60] (Ofis otopark─▒ ┼şarj soketi)
  sebeke_kapasitesi_kw: 150.0                  # VARSAYIM [min: 60.0, tipik: 150.0, max: 300.0] (─░┼ş yeri trafo tahsis g├╝c├╝)
  soket_gucu_kw: 22.0                          # PARAMETRE TERC─░H─░ (VARSAYIM): Tipik 3-faz Tip-2 AC ┼şarj ├╝nitesi anma g├╝c├╝ (22 kW)
  arac_obc_kw: 11.0                            # PARAMETRE TERC─░H─░ (VARSAYIM): Tipik binek EV dahili AC ┼şarj ├╝nitesi (OBC) g├╝c├╝ (11 kW)
  arac_sayisi_havuz: 75                        # VARSAYIM [min: 30, tipik: 75, max: 150] (Kay─▒tl─▒ ┼şirket ├ğal─▒┼şan─▒ EV filosu)
  arac_olasiligi_haftaici: 0.70                # VARSAYIM [min: 0.40, tipik: 0.70, max: 0.95] (Hafta i├ği soket doluluk oran─▒)
  hafta_sonu_carpani: 0.12                     # VARSAYIM [min: 0.05, tipik: 0.12, max: 0.25] (Hafta sonu i┼ş yeri ├ğal─▒┼şma oran─▒)
  tatil_carpani: 0.05                          # VARSAYIM [min: 0.00, tipik: 0.05, max: 0.15] (Resm├« tatil doluluk ├ğarpan─▒)
  kis_enerji_carpani: 1.00                     # VARSAYIM [min: 1.00, tipik: 1.15, max: 1.30] (ACN baz kalibrasyonu i├ğin 1.00; k─▒┼ş art─▒┼ş─▒ duyarl─▒l─▒k analizinde incelenir)
  ev_buyume_orani_yillik: 0.25                 # VARSAYIM: Senaryo analizinde kullan─▒lan y─▒ll─▒k EV filo b├╝y├╝me oran─▒ (%25)

  # ACN ampirik da─ş─▒l─▒m parametreleri (Ortak ├Ârnekleme yedek parametreleri)
  varis_saat_aralik: [6.5, 12.0]               # ACN ampirik aral─▒k: Sabah i┼şe var─▒┼ş yo─şunlu─şu
  sure_dk_medyan: 480.0                        # ACN ampirik medyan: 8 saat tipik mesai
  sure_dk_sd: 120.0                            # ACN ampirik da─ş─▒l─▒m yay─▒l─▒m─▒
  kwh_medyan: 13.5                             # ACN ampirik medyan teslim enerjisi
  beyan_kayma_dk_ort: 33.0                     # ACN ampirik: Kullan─▒c─▒n─▒n beyan etti─şi s├╝reden ort. 33 dk sapmas─▒
  beyan_kayma_dk_sd: 60.0                      # ACN ampirik sapma standart sapmas─▒
  beyan_kwh_carpan_aralik: [1.05, 1.45]        # ACN ampirik: Beyan edilen enerjinin ger├ğek teslimattan fazla olma oran─▒

# ------------------------------------------------------------------------------
# Senaryo 2: apartman_gece
# Toplu konut / site ak┼şam-gece ┼şarj─▒. ACN kar┼ş─▒l─▒─ş─▒ YOKTUR; tamamen VARSAYIM modelidir.
# ------------------------------------------------------------------------------
apartman_gece:
