  site_id: "TR_APT"
  kalibrasyon_tipi: "VARSAYIM_MODELI"          # ACN kar┼ş─▒l─▒─ş─▒ yoktur; t├╝m parametreler varsay─▒md─▒r
  soket_sayisi: 20                             # VARSAYIM [min: 10, tipik: 20, max: 50] (Site ortak/tahsisli otopark─▒)
  sebeke_kapasitesi_kw: 80.0                   # VARSAYIM [min: 40.0, tipik: 80.0, max: 180.0] (Apartman ortak trafo ayr─▒lan pay─▒)
  soket_gucu_kw: 11.0                          # PARAMETRE TERC─░H─░ (VARSAYIM): Tipik konut tipi 3-faz 16A AC Wallbox g├╝c├╝ (11 kW)
  arac_obc_kw: 11.0                            # PARAMETRE TERC─░H─░ (VARSAYIM): Tipik 11 kW dahili AC ┼şarj ├╝nitesi (OBC)
  arac_sayisi_havuz: 45                        # VARSAYIM [min: 20, tipik: 45, max: 90] (Sitedeki elektrikli ara├ğ sahibi say─▒s─▒)
  arac_olasiligi_haftaici: 0.65                # VARSAYIM [min: 0.35, tipik: 0.65, max: 0.85] (Gece ┼şarja takma olas─▒l─▒─ş─▒)
  hafta_sonu_carpani: 0.85                     # VARSAYIM [min: 0.60, tipik: 0.85, max: 1.00] (Hafta sonu eve d├Ân├╝┼ş/kalma ├ğarpan─▒)
  tatil_carpani: 0.80                          # VARSAYIM [min: 0.50, tipik: 0.80, max: 1.00] (Tatil g├╝nleri site i├ği kullan─▒m ├ğarpan─▒)
  kis_enerji_carpani: 1.20                     # VARSAYIM [min: 1.00, tipik: 1.20, max: 1.35] (K─▒┼ş d├Ânemi kabin ├Ân ─▒s─▒tma ve batarya kondisyonlama kaynakl─▒ t├╝ketim art─▒┼ş varsay─▒m─▒)
  ev_buyume_orani_yillik: 0.30                 # VARSAYIM: Konut tipi EV ┼şarj noktas─▒ yayg─▒nla┼şma varsay─▒m─▒ (%30)

  # Konut davran─▒┼ş─▒ parametreleri (VARSAYIM [min, tipik, max])
  varis_saat_ort: 19.25                        # VARSAYIM [min: 17.5, tipik: 19.25, max: 21.0] (Ak┼şam eve d├Ân├╝┼ş: 19:15)
  varis_saat_sd: 1.20                          # VARSAYIM [min: 0.8, tipik: 1.20, max: 1.8] (Var─▒┼ş saati varyans─▒)
  cikis_saat_ort: 7.75                         # VARSAYIM [min: 6.5, tipik: 7.75, max: 9.0] (Sabah evden ├ğ─▒k─▒┼ş: 07:45)
  cikis_saat_sd: 0.60                          # VARSAYIM [min: 0.4, tipik: 0.60, max: 1.0] (S├╝r├╝c├╝n├╝n temel al─▒┼şkanl─▒k yay─▒l─▒m─▒)
  cikis_gunluk_sapma_sd: 0.45                  # VARSAYIM [min: 0.25, tipik: 0.45, max: 0.75] (G├╝nden g├╝ne sapma saati)
  gunluk_yol_km_medyan: 42.0                   # VARSAYIM: ┼Şehir i├ği g├╝nl├╝k binek ara├ğ s├╝r├╝┼ş mesafesi modelleme parametresi (42 km)
  tuketim_kwh_100km: 18.5                      # VARSAYIM: Tipik C-SUV elektrikli ara├ğ karma t├╝ketim parametresi (18.5 kWh/100 km)
  kwh_ihtiyac_log_ort: 2.35                    # VARSAYIM: G├╝nl├╝k ~10.5 kWh enerji ihtiyac─▒ (42 km x 0.185 kWh/km + kay─▒p)
  kwh_ihtiyac_log_sd: 0.45                     # VARSAYIM: Enerji ihtiyac─▒ de─şi┼şkenli─şi
  kwh_ihtiyac_ust_sinir: 65.0                  # VARSAYIM: Tek oturumda talep edilebilecek azami enerji ├╝st s─▒n─▒r─▒ (65 kWh)
  beyan_kayma_dk_ort: 30.0                     # VARSAYIM [min: 15.0, tipik: 30.0, max: 60.0] (Apartmanda erken/ge├ğ ├ğ─▒k─▒┼ş sapmas─▒)
  beyan_kayma_dk_sd: 75.0                      # VARSAYIM [min: 40.0, tipik: 75.0, max: 120.0] (Sapma standart sapmas─▒)
  beyan_kwh_carpan_aralik: [1.10, 1.55]        # VARSAYIM [min: 1.05, tipik: [1.10, 1.55], max: 1.80] (Kullan─▒c─▒ a┼ş─▒r─▒ enerji beyan─▒)

